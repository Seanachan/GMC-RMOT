name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless numpy tqdm pytest ruff
      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: pytest -q -rs
